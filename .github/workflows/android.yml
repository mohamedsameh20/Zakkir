name: Build Android APK

# This branch holds only the Android app, so any change except docs can affect
# the build.
on:
  push:
    branches:
      - zakkir-android
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - zakkir-android
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# The renderer bundle, the Android sound resources and the native android/
# directory are all generated, so every job below builds them from source.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate renderer bundle and Android sound resources
        run: npm run generate-renderer

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Verify notification sounds were bundled
        # The sound picker is only functional if these land in res/raw, so fail
        # the build loudly rather than shipping a silent regression.
        run: |
          missing=0
          for sound in chime bell soft_ping; do
            if [ ! -f "android/app/src/main/res/raw/$sound.mp3" ]; then
              echo "::error::missing res/raw/$sound.mp3"
              missing=1
            fi
          done
          # The adhan recordings stay out of the APK until their rights are confirmed.
          for sound in adhan_1 adhan_2; do
            if [ -f "android/app/src/main/res/raw/$sound.mp3" ]; then
              echo "::error::res/raw/$sound.mp3 must not be bundled"
              missing=1
            fi
          done
          exit $missing

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zakkir-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
